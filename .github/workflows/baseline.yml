name: Windows baseline without CAD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and verify isolated baseline
        shell: pwsh
        run: ./verify-baseline.ps1 -PythonPath (Get-Command python.exe).Source
      - name: Check workplane switch coordinate and no-replay boundaries
        shell: pwsh
        run: ./verify-workplane-switch.ps1
      - name: Check explicit process identity pin without COM or CAD
        shell: pwsh
        run: ./verify-process-pin.ps1
      - name: Check owned selection lifecycle without CAD
        shell: pwsh
        run: ./verify-owned-selection.ps1
      - name: Compile passive surface diagnostics without execution
        shell: pwsh
        run: ./verify-surface-diagnostics.ps1
      - name: Check passive surface COM shape and precision without CAD
        shell: pwsh
        run: ./verify-surface-sampling.ps1
      - name: Check separately gated owned SURFACE selection without CAD
        shell: pwsh
        run: ./verify-owned-surface-selection.ps1
      - name: Check separately gated owned SURFACE translation without CAD
        shell: pwsh
        run: ./verify-owned-surface-translation.ps1
      - name: Check ordered owned SURFACE set translation and partial failure without CAD
        shell: pwsh
        run: ./verify-surface-set-translation.ps1
      - name: Check separately gated owned SURFACE rotation without CAD
        shell: pwsh
        run: ./verify-owned-surface-rotation.ps1
      - name: Check separately gated owned SURFACE uniform scale without CAD
        shell: pwsh
        run: ./verify-owned-surface-scale.ps1
      - name: Check passive COMPCURVE layout and native errors without CAD
        shell: pwsh
        run: ./verify-curve-layout.ps1
      - name: Check one COMPCURVE translation lifecycle without CAD
        shell: pwsh
        run: ./verify-curve-translation.ps1
      - name: Check passive combined COMPCURVE and SOLID witnesses without CAD
        shell: pwsh
        run: ./verify-curve-witness.ps1
      - name: Check one COMPCURVE WORLD Z90 rotation without CAD
        shell: pwsh
        run: ./verify-curve-rotation.ps1
      - name: Check one COMPCURVE uniform scale without CAD
        shell: pwsh
        run: ./verify-owned-curve-scale.ps1
      - name: Check passive COMPCURVE scale selection-stop inspection without CAD
        shell: pwsh
        run: ./verify-curve-scale-stop.ps1
      - name: Check separate clear-only COMPCURVE scale-stop recovery without CAD
        shell: pwsh
        run: ./verify-curve-scale-stop-recovery.ps1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: K1-baseline
          path: |
            evidence/K1-baseline
            evidence/workplane-switch-ci
            evidence/owned-selection-ci
            evidence/surface-diagnostics-ci
            evidence/surface-sampling-ci
            evidence/owned-surface-selection-ci
            evidence/owned-surface-translation-ci
            evidence/surface-set-translation-ci
            evidence/process-pin-ci
            evidence/owned-surface-rotation-ci
            evidence/owned-surface-scale-ci
            evidence/curve-layout-ci
            evidence/curve-translation-ci
            evidence/curve-witness-ci
            evidence/curve-rotation-ci
            evidence/owned-curve-scale-ci
            evidence/curve-scale-stop-ci
            evidence/curve-scale-stop-recovery-ci
          if-no-files-found: error
